name: iOS — TestFlight upload

# Signs and uploads both apps to TestFlight. Needs these repository secrets:
#   APPLE_TEAM_ID            10-char team id (developer.apple.com/account, Membership)
#   APPLE_CERT_P12_BASE64    Apple Distribution certificate + private key, .p12, base64
#   APPLE_CERT_PASSWORD      the .p12 export password
#   ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8_BASE64
#                            App Store Connect API key (App Manager role), .p8 base64
# Provisioning profiles (IOS_APP_STORE) were created through the App Store Connect API
# (.secrets/asc-profiles.mjs, local only) and live in PROFILE_CARRADIO_BASE64 /
# PROFILE_PELOTON_BASE64. Manual signing: Xcode's automatic path insists on a Development
# profile for the archive step, which needs a registered device, and the team has none.
# Car Radio's entitlements file is chosen at runtime: the CarPlay one if the profile carries
# com.apple.developer.carplay-communication, otherwise the CarPlay-free fallback.

on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/testflight.yml"]
  workflow_dispatch:

jobs:
  upload:
    # App Store Connect requires the iOS 26 SDK (Xcode 26); macos-26 images default to it.
    runs-on: macos-26
    if: ${{ vars.TESTFLIGHT_ENABLED == 'true' }}
    defaults:
      run: { working-directory: ios }
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme: PelotonCB
            profile_secret: PROFILE_PELOTON_BASE64
            profile_name: PelotonCB AppStore
          - scheme: CarRadio
            profile_secret: PROFILE_CARRADIO_BASE64
            profile_name: CarRadio Live AppStore
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      - run: brew install xcodegen

      - name: Import signing certificate into a throwaway keychain
        env:
          P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN=$RUNNER_TEMP/signing.keychain-db
          KC_PASS=$(uuidgen)
          echo "$P12_BASE64" | base64 --decode > $RUNNER_TEMP/cert.p12
          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          security import $RUNNER_TEMP/cert.p12 -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASS" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          echo "KEYCHAIN=$KEYCHAIN" >> $GITHUB_ENV

      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets[matrix.profile_secret] }}
        run: |
          set -euo pipefail
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_BASE64" | base64 --decode > $RUNNER_TEMP/profile.mobileprovision
          UUID=$(security cms -D -i $RUNNER_TEMP/profile.mobileprovision | plutil -extract UUID raw -)
          cp $RUNNER_TEMP/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
          echo "profile $UUID installed"
          if [ "${{ matrix.scheme }}" = "CarRadio" ]; then
            if security cms -D -i $RUNNER_TEMP/profile.mobileprovision | grep -q carplay-communication; then
              echo "profile carries the CarPlay entitlement"
            else
              echo "profile has NO CarPlay entitlement: signing with the CarPlay-free fallback"
              sed -i '' 's|CODE_SIGN_ENTITLEMENTS: CarRadio/Resources/CarRadio.entitlements|CODE_SIGN_ENTITLEMENTS: CarRadio/Resources/CarRadio-TestFlight.entitlements|' project.yml
            fi
          fi

      - run: xcodegen generate

      - name: Write App Store Connect API key
        env:
          P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p ~/.private_keys
          echo "$P8_BASE64" | base64 --decode > ~/.private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
          echo "ASC_KEY_PATH=$HOME/.private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8" >> $GITHUB_ENV

      - name: Archive ${{ matrix.scheme }}
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          # Signing settings are on the app targets in project.yml (package targets must
          # not see them); only the version numbers are passed here.
          xcodebuild -project CarRadio.xcodeproj -scheme ${{ matrix.scheme }} \
            -destination 'generic/platform=iOS' -configuration Release \
            -archivePath build/${{ matrix.scheme }}.xcarchive archive \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            MARKETING_VERSION=0.1.${{ github.run_number }} | tail -40

      - name: Export + upload to TestFlight
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict>
              <key>${{ matrix.scheme == 'CarRadio' && 'live.car-radio.app' || 'com.pelotoncb.app' }}</key>
              <string>${{ matrix.profile_name }}</string>
            </dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/${{ matrix.scheme }}.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export-${{ matrix.scheme }} \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" | tail -30

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN" || true
