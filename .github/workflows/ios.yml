name: iOS — build (macOS runner)

on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # macos-15 ships Xcode 16, required for the project format current XcodeGen emits.
    runs-on: macos-15
    defaults:
      run: { working-directory: ios }
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build (simulator, no signing)
        run: |
          if ! xcodebuild -project CarRadio.xcodeproj -scheme CarRadio \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug build \
            CODE_SIGNING_ALLOWED=NO > build.log 2>&1; then
            echo "== BUILD FAILED, errors: =="
            grep -E "error:" build.log | sort -u | head -60
            exit 1
          fi
          tail -5 build.log
      - name: Unit tests (core)
        run: |
          if ! xcodebuild -project CarRadio.xcodeproj -scheme CarRadio \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            test CODE_SIGNING_ALLOWED=NO > test.log 2>&1; then
            echo "== TESTS FAILED: =="
            grep -E "error:|failed|Failing" test.log | sort -u | head -60
            exit 1
          fi
          grep -E "Executed|passed" test.log | tail -5
      - name: Unsigned device build + ipa
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild -project CarRadio.xcodeproj -scheme CarRadio \
            -destination 'generic/platform=iOS' \
            -configuration Release build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CONFIGURATION_BUILD_DIR=$PWD/build-device | tail -20
          mkdir -p Payload && cp -R build-device/CarRadio.app Payload/
          zip -qr carradio-ios-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        if: hashFiles('ios/carradio-ios-unsigned.ipa') != ''
        with: { name: carradio-ios-unsigned-ipa, path: ios/carradio-ios-unsigned.ipa }
      - name: Update latest-builds release
        if: hashFiles('ios/carradio-ios-unsigned.ipa') != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create latest-builds --prerelease \
            --title "Latest builds (auto)" \
            --notes "Rolling debug builds from main." || true
          gh release upload latest-builds carradio-ios-unsigned.ipa --clobber
