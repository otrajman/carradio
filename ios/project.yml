# XcodeGen project spec for the Car Radio iOS + CarPlay client.
# Generate with:  xcodegen generate   (run inside ios/)
name: CarRadio

options:
  bundleIdPrefix: com.carradio
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  supabase-swift:
    url: https://github.com/supabase/supabase-swift
    # Verified against 2.53.0 (the API surface used compiles against it).
    from: 2.53.0

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  CarRadio:
    type: application
    platform: iOS
    sources:
      - path: CarRadio
        excludes:
          - "Resources/Info.plist"
          - "Resources/CarRadio.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.carradio.app
        PRODUCT_NAME: CarRadio
        INFOPLIST_FILE: CarRadio/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: CarRadio/Resources/CarRadio.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SWIFT_EMIT_LOC_STRINGS: NO
    dependencies:
      - package: supabase-swift
        product: Supabase

  CarRadioTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CarRadioTests
    dependencies:
      - target: CarRadio

schemes:
  CarRadio:
    build:
      targets:
        CarRadio: all
        CarRadioTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CarRadioTests
